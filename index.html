<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover Malaysian Philharmonic Orchestra (MPO) concerts featuring your favourite classical & modern composers."
    />
    <title>MPO Repertoire · Malaysian Philharmonic Orchestra Recommender</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎻</text></svg>"
    />

    <!-- Google Fonts: Cinzel, Cormorant Garamond, Albert Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      (() => {
        const mode = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-mode", mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body
    class="bg-[#0C0B0E] text-[#EDE6D6] antialiased min-h-screen selection:bg-[#D4AF37]/30 selection:text-[#FBF8F1]"
  >
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
